<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | CareerPulse</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="brand">
        <div class="brand-icon">CP</div>
        Career<span>Pulse</span>
      </a>
      <ul class="nav-links" id="nav-links"></ul>
      <div class="nav-actions" id="nav-actions"></div>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card">
        
        <div class="auth-header">
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Log in to access your jobs, applications, or portal dashboard.</p>
        </div>

        <!-- 1-Click Demo Login Box -->
        <div class="demo-logins-box">
          <div class="demo-title">⚡ Quick 1-Click Demo Accounts (Indian Profiles)</div>
          <div class="demo-btn-group">
            <button type="button" class="btn-demo" onclick="fillDemo('seeker@demo.com', 'seeker123')">
              👨‍💻 Arjun Patel (Seeker)
            </button>
            <button type="button" class="btn-demo" onclick="fillDemo('recruiter@demo.com', 'recruiter123')">
              🏢 Priya Sharma (Recruiter)
            </button>
            <button type="button" class="btn-demo" onclick="fillDemo('admin@jobportal.com', 'admin123')">
              🛡️ Rajesh Sharma (Admin)
            </button>
          </div>
        </div>

        <!-- Login Form -->
        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
              <a href="javascript:void(0)" style="font-size: 12px; color: var(--text-muted);" onclick="alert('For demo accounts, use password: seeker123, recruiter123, or admin123')">Forgot password?</a>
            </div>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" id="btn-login-submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
            Log In to Account
          </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted);">
          Don't have an account? <a href="/register.html" style="font-weight: 700;">Sign up here</a>
        </div>

      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-copy">&copy; 2026 CareerPulse Job Portal. Node.js Fullstack.</div>
      <ul class="footer-links">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/jobs.html">Browse Jobs</a></li>
      </ul>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    function fillDemo(email, pass) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pass;
      document.getElementById('login-form').requestSubmit();
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const submitBtn = document.getElementById('btn-login-submit');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      try {
        const res = await api.post('/auth/login', { email, password });
        api.setToken(res.token);
        api.setUser(res.user);
        showToast('Login successful! Redirecting...', 'success');

        setTimeout(() => {
          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect');
          if (redirect) {
            window.location.href = redirect;
            return;
          }

          if (res.user.role === 'admin') {
            window.location.href = '/admin-dashboard.html';
          } else if (res.user.role === 'recruiter') {
            window.location.href = '/recruiter-dashboard.html';
          } else {
            window.location.href = '/seeker-dashboard.html';
          }
        }, 600);
      } catch (err) {
        showToast(err.message || 'Login failed. Please verify credentials.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In to Account';
      }
    });
  </script>
</body>
</html>
